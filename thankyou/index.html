<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <style>
    :root{--ink:#173c35;--gold:#d8ad67;--paper:#fbfaf7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;text-align:center;padding:24px}.card{width:min(560px,100%);background:#fff;padding:58px 30px;box-shadow:0 22px 60px #173c3520;border-top:4px solid var(--gold)}.mark{width:58px;height:58px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:28px}.card h1{margin:0 0 14px;font:38px Georgia,'Times New Roman',serif}.card p{margin:0;color:#68716d;font-size:17px;line-height:1.6}.back{display:inline-block;margin-top:28px;padding:13px 20px;background:var(--ink);color:#fff;text-decoration:none;border-radius:3px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✓</div>
    <h1>Thanks for sharing the information</h1>
    <p>Our team will get back to you shortly.</p>
    <a class="back" href="../">Back to home</a>
  </main>
</body>
</html>
